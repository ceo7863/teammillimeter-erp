# Reproducible nginx site config for erp.teammillimeter.com
# Applied on the EC2 host at /etc/nginx/sites-available/erp
#
# Requires: /etc/nginx/conf.d/teamchat-sse-log-format.conf (log_format teamchat_sse_safe)
# - Dedicated SSE location logs $uri only (no query string)
# - Default combined log must never include $http_authorization

server {
    server_name 52.78.74.101 erp.teammillimeter.com;
    client_max_body_size 25M;

    # Bearer-only SSE: never record ?token= from legacy clients in access.log
    location = /api/team-chat/events {
        access_log /var/log/nginx/access.log teamchat_sse_safe;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/erp.teammillimeter.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/erp.teammillimeter.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = erp.teammillimeter.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name 52.78.74.101 erp.teammillimeter.com;
    return 404; # managed by Certbot
}
