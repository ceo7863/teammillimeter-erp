# Included from http {} via /etc/nginx/conf.d/
# Intentionally omits query string and Authorization.
log_format teamchat_sse_safe '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent"';
