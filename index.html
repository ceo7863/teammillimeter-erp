<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="content-language" content="ko" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TM ERP" />
    <meta name="description" content="팀밀리미터 업무 관리 ERP" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        var SHELL_VERSION = "13";
        var SHELL_KEY = "erp-app-shell-version";
        var isChat = /^\/chat\/?$/i.test(location.pathname);
        var isWorkerPortal = /^\/worker-portal\/?$/i.test(location.pathname);

        function clearAppShell() {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                void reg.unregister();
              });
            });
          }
          if ("caches" in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (key) {
                void caches.delete(key);
              });
            });
          }
        }

        try {
          var prev = localStorage.getItem(SHELL_KEY);
          if (prev !== SHELL_VERSION) {
            localStorage.setItem(SHELL_KEY, SHELL_VERSION);
            clearAppShell();
          }
        } catch (e) {
          // ignore storage errors
        }

        // Chat / worker portal must not share ERP SW scope, or "Add to Home Screen" opens ERP login.
        if (isChat || isWorkerPortal) {
          clearAppShell();
        }

        if (!isChat && !isWorkerPortal) return;
        var manifest = document.querySelector('link[rel="manifest"]');
        var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        var description = document.querySelector('meta[name="description"]');
        var theme = document.querySelector('meta[name="theme-color"]');
        var icon = document.querySelector('link[rel="icon"]');
        var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');

        if (isChat) {
          if (manifest) manifest.href = "/chat.manifest.webmanifest";
          document.title = "TM ERP AI";
          if (appleTitle) appleTitle.content = "TM ERP AI";
          if (description) description.content = "팀밀리미터 ERP AI 음성 챗봇";
          if (theme) theme.content = "#4c1d95";
          if (icon) icon.href = "/icon-chat.svg";
          if (appleIcon) appleIcon.href = "/icon-chat-192.png";
          return;
        }

        if (isWorkerPortal) {
          if (manifest) manifest.href = "/worker-portal.manifest.webmanifest";
          document.title = "시공내역서";
          if (appleTitle) appleTitle.content = "시공내역서";
          if (description) description.content = "팀밀리미터 시공내역서 포털";
          if (theme) theme.content = "#1c1917";
          if (icon) icon.href = "/icon.svg";
          if (appleIcon) appleIcon.href = "/icon-192.png";
        }
      })();
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>TeamMillimeter ERP</title>
  </head>
  <body lang="ko">
    <div id="root"></div>
    <script>
      window.__erpBootTimer = window.setTimeout(function () {
        var root = document.getElementById("root");
        if (!root || root.children.length) return;
        root.innerHTML =
          '<div style="display:flex;min-height:100dvh;align-items:center;justify-content:center;padding:24px;background:#f8fafc;font-family:system-ui,sans-serif;color:#334155;text-align:center"><div><p style="font-weight:700;margin:0 0 8px">앱을 불러오지 못했습니다</p><p style="margin:0 0 16px;font-size:14px;color:#64748b">아래 버튼으로 다시 시도해 주세요.</p><button type="button" onclick="location.reload()" style="padding:10px 16px;border:0;border-radius:10px;background:#0f172a;color:#fff;font-weight:700">새로고침</button></div></div>';
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
