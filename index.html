<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="content-language" content="ko" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TM ERP" />
    <meta name="description" content="팀밀리미터 업무 관리 ERP" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        if (!/^\/chat\/?$/i.test(location.pathname)) return;
        var manifest = document.querySelector('link[rel="manifest"]');
        if (manifest) manifest.href = "/chat.manifest.webmanifest";
        document.title = "TM ERP AI";
        var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appleTitle) appleTitle.content = "TM ERP AI";
        var description = document.querySelector('meta[name="description"]');
        if (description) description.content = "팀밀리미터 ERP AI 음성 챗봇";
        var theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.content = "#4c1d95";
        var icon = document.querySelector('link[rel="icon"]');
        if (icon) icon.href = "/icon-chat.svg";
        var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
        if (appleIcon) appleIcon.href = "/icon-chat-192.png";
      })();
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>TeamMillimeter ERP</title>
  </head>
  <body lang="ko">
    <div id="root"></div>
    <style>
      #root:empty {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #64748b;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }

      #root:empty::after {
        content: "불러오는 중…";
        font-size: 0.9375rem;
        font-weight: 600;
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
